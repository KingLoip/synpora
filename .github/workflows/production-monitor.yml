name: SYNPORA Production Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  # Run a fresh read-only production check after main CI has completed, even when
  # GitHub's scheduled-event queue is delayed. Only successful main-branch CI runs qualify.
  workflow_run:
    workflows: ["SYNPORA CI"]
    types: [completed]
    # Filter upstream PR checks here, before they can compete with scheduled live runs.
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/production-monitor.yml"

permissions:
  contents: read

concurrency:
  # Pull-request validation must never cancel a scheduled/manual live-production check.
  group: synpora-production-monitor-${{ github.event_name == 'pull_request' && 'pull-request' || 'live' }}
  cancel-in-progress: true

jobs:
  live-market-health:
    # Never gate a pull request on production state from code that has not been deployed yet.
    # Scheduled/manual runs continue to validate the live deployment after rollout.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    name: Live readiness and collector freshness
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify live service and external market data
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow trigger: ${GITHUB_EVENT_NAME}"
          echo "Workflow ref: ${GITHUB_REF}"
          echo "Workflow commit: ${GITHUB_SHA}"
          BASE_URL="https://synpora-production.up.railway.app"
          CANONICAL_URL="https://synpora.com"

          fetch_json() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --fail --location \
              --connect-timeout 5 --max-time 15 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              "$url" --output "$output"
          }

          fetch_text() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --fail --location \
              --connect-timeout 5 --max-time 15 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              "$url" --output "$output"
          }

          expect_secret_path_blocked() {
            local path="$1"
            local body="/tmp/security-probe.body"
            local status
            status="$(curl --silent --show-error --output "$body" \
              --write-out '%{http_code}' --connect-timeout 5 --max-time 10 \
              "$CANONICAL_URL$path")"
            case "$status" in
              403|404|410) ;;
              *)
                echo "Security probe failed: $path returned HTTP $status (expected 403, 404, or 410)." >&2
                return 1
                ;;
            esac
            if grep -Eiq '(DATABASE_URL=|SYNPORA_JWT_SECRET=|BEGIN [A-Z ]*PRIVATE KEY|gitdir:)' "$body"; then
              echo "Security probe failed: sensitive-looking content returned for $path." >&2
              return 1
            fi
            echo "  $path: blocked (HTTP $status)"
          }

          # Check both the Railway service and the public custom domain.
          fetch_json "$BASE_URL/health" /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json >/dev/null
          fetch_text "$CANONICAL_URL/" /tmp/home.html
          grep -Eiq 'synpora' /tmp/home.html
          fetch_text "$CANONICAL_URL/ops" /tmp/ops.html
          grep -Eiq 'synpora' /tmp/ops.html

          echo "Secret/config path exposure checks:"
          expect_secret_path_blocked "/.env"
          expect_secret_path_blocked "/.env.production"
          expect_secret_path_blocked "/.git/config"
          expect_secret_path_blocked "/.git-credentials"

          fetch_json "$BASE_URL/api/v1/system/release" /tmp/release.json
          jq -e '.hardware_write == false and .autonomous_control == false' /tmp/release.json >/dev/null

          fetch_json "$BASE_URL/api/v1/system/production-readiness" /tmp/readiness.json
          fetch_json "$BASE_URL/api/v1/market/data-health" /tmp/data-health.json
          fetch_json "$BASE_URL/api/v1/system/collector-status" /tmp/collector.json

          echo "Public entrypoints:"
          echo "  Railway health: PASS"
          echo "  synpora.com homepage: PASS"
          echo "  synpora.com/ops dashboard: PASS"

          echo "Release safety:"
          jq '{release, mode, hardware_write, autonomous_control}' /tmp/release.json

          echo "Readiness and per-field provenance:"
          jq '{status, database_backend, database_reachable, database_schema_ready, market_data_ready, market_data_ready_snapshots_scanned, market_data_latest_ready_age_seconds, market_data_eligible_snapshots_scanned, market_data_latest_eligible_age_seconds, market_data_field_diagnostics, market_data_guidance}' /tmp/readiness.json

          echo "Collector heartbeat:"
          jq '{enabled, last_attempt_result, last_quality, last_attempt_at, last_success_at, last_attempt_duration_ms, consecutive_failures, next_attempt_at, retry_delay_seconds}' /tmp/collector.json

          jq -e '
            .status == "ready" and
            .database_backend == "postgresql" and
            .database_reachable == true and
            .database_schema_ready == true and
            .market_data_ready == true and
            (.market_data_latest_ready_age_seconds | type) == "number" and
            .market_data_latest_ready_age_seconds >= -30 and
            .market_data_latest_ready_age_seconds <= 900 and
            (.market_data_ready_snapshots_scanned | type) == "number" and
            .market_data_ready_snapshots_scanned > 0 and
            .hardware_write_enabled == false and
            .autonomous_control_enabled == false and
            (.market_data_field_diagnostics.btc_hashprice_usd_ph_day |
              .available == true and .source == "external" and (.age_seconds | type) == "number" and .age_seconds >= -60 and .age_seconds <= 900) and
            (.market_data_field_diagnostics.gpu_l40s_usd_hour |
              .available == true and .source == "external" and (.age_seconds | type) == "number" and .age_seconds >= -60 and .age_seconds <= 900) and
            (.market_data_field_diagnostics.eur_usd |
              .available == true and .source == "external" and (.age_seconds | type) == "number" and .age_seconds >= -60 and .age_seconds <= 345600)
          ' /tmp/readiness.json >/dev/null

          jq -e '
            .enabled == true and
            .last_attempt_result == "success" and
            .last_quality == "live" and
            .last_success_at != null and
            (now - .last_success_at) >= -30 and
            (now - .last_success_at) <= 900 and
            .consecutive_failures == 0
          ' /tmp/collector.json >/dev/null

          jq '{eligible_snapshots, excluded_or_invalid_snapshots, latest_eligible_age_seconds, latest_snapshot_age_seconds, latest_snapshot_source, latest_snapshot_providers, warnings}' /tmp/data-health.json
          echo "SYNPORA production monitor: PASS"
