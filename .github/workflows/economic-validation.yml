name: SYNPORA Economic Validation

on:
  pull_request:
  workflow_run:
    workflows: ["SYNPORA CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synpora-economic-validation
  cancel-in-progress: false

jobs:
  empirical-economic-validation:
    if: github.head_ref != 'btc-history-export-readonly' && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent empirical economic validation and enforce forecast gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SYNPORA_SAVE_RAW_MARKET_HISTORY: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/economic_validation.py > /tmp/synpora-economic-validation.json
          python - <<'PY'
          import json
          import os
          import sys

          with open("/tmp/synpora-economic-validation.json", encoding="utf-8") as handle:
              report = json.load(handle)

          gates = {}
          for name, result in report.get("results", {}).items():
              backtest = result["empirical_risk_aware_walk_forward"]
              legacy_gate = dict(backtest.get("forecast_quality_gate", {}))
              validation = backtest.get("production_corrected_horizon_validation", {})
              horizon_gate = validation.get("release_gate", {})
              one_hour = validation.get("horizons", {}).get("1", {})
              gate = {
                  "status": "pass" if horizon_gate.get("status") == "pass" else "blocked",
                  "actual_pairs": one_hour.get("pairs", 0),
                  "observed_mae_skill_vs_persistence": one_hour.get("mae_skill_vs_persistence"),
                  "horizon_release_status": horizon_gate.get("status", "missing"),
                  "ineligible_horizons_hours": horizon_gate.get("ineligible_horizons_hours", [1, 6, 24, 72]),
                  "legacy_single_step_diagnostic": legacy_gate.get("status", "unknown"),
              }
              gates[name] = gate
          blocked = {
              name: gate for name, gate in gates.items()
              if gate.get("status") != "pass"
          }
          if not gates:
              blocked["missing_economic_scenarios"] = {"status": "missing"}
          investment = report.get("investment_readiness", {})
          assumptions = report.get("assumptions", {})
          lines = [
              "# SYNPORA empirical economic validation",
              "",
              f"- Production horizon release gate: **{'PASS' if not blocked else 'BLOCKED'}**",
              f"- Out-of-sample minimum pairs: 100",
              f"- Required MAE skill over persistence: 5%",
              f"- Required forecast horizons: 1h, 6h, 24h and 72h must all pass independently",
              f"- Investment validation: **{investment.get('status', 'unknown')}**",
              f"- BTC price external observations: {assumptions.get('btc_price_external_observations', 0)}",
              f"- BTC network-hashrate external observations: {assumptions.get('network_hashrate_external_observations', 0)}",
              f"- BTC difficulty external observations: {assumptions.get('difficulty_external_observations', 0)}",
              "",
              "| Tariff scenario | Horizon gate | 1h pairs | 1h MAE skill | Legacy diagnostic |",
              "|---|---:|---:|---:|---:|",
          ]
          for name, gate in gates.items():
              skill = gate.get("observed_mae_skill_vs_persistence")
              skill_text = "n/a" if skill is None else f"{skill:.3%}"
              lines.append(
                  f"| {name} | {gate.get('status')} | {gate.get('actual_pairs')} | {skill_text} | {gate.get('legacy_single_step_diagnostic')} |"
              )
          corrected = report.get("results", {})
          lines += [
              "",
              "## Horizon-aware production forecast validation",
              "",
              "| Tariff scenario | Horizon | OOS spacing (h) | Non-overlap | Bootstrap block (h) | Genuine OOS pairs | Fallbacks | History/separation fallbacks | Selector rejects | BTC persistence | GPU persistence | BTC selector diagnostics | GPU selector diagnostics | Total origins | Total observations for 100 non-overlapping OOS pairs* | Additional observations for 100 OOS pairs* | Additional days* | MAE skill | 95% CI low | BTC skill | GPU skill | Release blockers | Eligible |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---:|",
              "",
              "*Data-volume lower bound only. It does not imply that candidate selection, MAE skill, confidence intervals, or release approval will pass.",
          ]
          for name, result in corrected.items():
              backtest = result.get("empirical_risk_aware_walk_forward", {})
              validation = backtest.get("production_corrected_horizon_validation", {})
              for horizon, metrics in validation.get("horizons", {}).items():
                  ci_low = metrics.get("mae_skill_confidence_interval_95", {}).get("lower_95")
                  ci_text = "n/a" if ci_low is None else f"{ci_low:.3%}"
                  skill = metrics.get("mae_skill_vs_persistence")
                  skill_text = "n/a" if skill is None else f"{skill:.3%}"
                  per = metrics.get("per_strategy", {})
                  btc = per.get("BTC Mining", {}).get("mae_skill_vs_persistence")
                  gpu = per.get("AI Compute", {}).get("mae_skill_vs_persistence")
                  btc_text = "n/a" if btc is None else f"{btc:.3%}"
                  gpu_text = "n/a" if gpu is None else f"{gpu:.3%}"
                  selector_diagnostics = metrics.get("selector_diagnostics", {})
                  btc_diagnostics = json.dumps(selector_diagnostics.get("BTC", {}), sort_keys=True, separators=(",", ":"))
                  gpu_diagnostics = json.dumps(selector_diagnostics.get("GPU", {}), sort_keys=True, separators=(",", ":"))
                  lines.append(
                      f"| {name} | {horizon}h | "
                      f"{metrics.get('history_growth_projection', {}).get('oos_pair_spacing_hours', 'n/a')} | "
                      f"{'yes' if metrics.get('oos_windows_non_overlapping') else 'no'} | "
                      f"{metrics.get('bootstrap_block_duration_hours', 'n/a')} | "
                      f"{metrics.get('genuine_model_pairs', metrics.get('pairs', 0))} | "
                      f"{metrics.get('persistence_fallback_pairs', 0)} | "
                      f"{metrics.get('skipped_insufficient_model_history', 0)}/"
                      f"{metrics.get('persistence_fallback_due_insufficient_separated_origins', 0)} | "
                      f"{metrics.get('selector_rejection_fallback_pairs', 0)} | "
                      f"{metrics.get('btc_persistence_selector_fallbacks', 0)} | "
                      f"{metrics.get('gpu_persistence_selector_fallbacks', 0)} | "
                      f"`{btc_diagnostics}` | `{gpu_diagnostics}` | "
                      f"{metrics.get('total_horizon_matched_origins', 0)} | "
                      f"{metrics.get('minimum_total_observations_for_100_nonoverlapping_oos_pairs', 'n/a')} | "
                      f"{metrics.get('history_growth_projection', {}).get('additional_observations_estimate', 'n/a')} | "
                      f"{metrics.get('history_growth_projection', {}).get('estimated_additional_days_at_current_cadence', 'n/a')} | "
                      f"{skill_text} | {ci_text} | {btc_text} | {gpu_text} | "
                      f"{'; '.join(metrics.get('release_blockers', [])) or 'none'} | "
                      f"{metrics.get('release_eligible', False)} |"
                  )
          lines += [
              "",
              "## Independent BTC/GPU model diagnostics (not a release override)",
              "",
              "| Tariff scenario | Horizon | BTC independent pairs | BTC MAE skill | BTC 95% CI low | BTC eligible | GPU independent pairs | GPU MAE skill | GPU 95% CI low | GPU eligible |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for name, result in corrected.items():
              validation = result.get("empirical_risk_aware_walk_forward", {}).get(
                  "production_corrected_horizon_validation", {})
              for horizon, metrics in validation.get("horizons", {}).items():
                  independent = metrics.get("per_strategy_independent_oos", {})
                  btc = independent.get("BTC Mining", {})
                  gpu = independent.get("AI Compute", {})
                  def diagnostic_cell(value, percent=False):
                      if value is None:
                          return "n/a"
                      return f"{value:.3%}" if percent else str(value)
                  btc_ci = btc.get("mae_skill_confidence_interval_95", {}).get("lower_95")
                  gpu_ci = gpu.get("mae_skill_confidence_interval_95", {}).get("lower_95")
                  lines.append(
                      f"| {name} | {horizon}h | {btc.get('pairs', 0)} | "
                      f"{diagnostic_cell(btc.get('mae_skill_vs_persistence'), True)} | "
                      f"{diagnostic_cell(btc_ci, True)} | {btc.get('release_eligible', False)} | "
                      f"{gpu.get('pairs', 0)} | "
                      f"{diagnostic_cell(gpu.get('mae_skill_vs_persistence'), True)} | "
                      f"{diagnostic_cell(gpu_ci, True)} | {gpu.get('release_eligible', False)} |"
                  )
          lines += [
              "",
              "Independent per-series diagnostics do not replace the joint non-overlapping horizon release gate. "
              "A strategy-specific fallback is excluded from that strategy's independent sample; the overall "
              "forecast release remains blocked until the joint gate passes.",
              "",
              "Investment validation remains separate from technical production readiness. "
              "No realized GPU payouts, BTC pool settlements, all-in electricity invoices, "
              "or metered battery outcomes are inferred from market quotes.",
          ]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if blocked:
              print("Forecast quality gate is blocked; do not promote SYNPORA as a validated forecasting product.", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Upload short-lived economic validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synpora-economic-validation-${{ github.run_id }}
          path: |
            /tmp/synpora-economic-validation.json
            /tmp/synpora-market-observations.json
          if-no-files-found: warn
          retention-days: 2
