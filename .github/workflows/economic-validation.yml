name: SYNPORA Economic Validation

on:
  pull_request:
  workflow_run:
    workflows: ["SYNPORA CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synpora-economic-validation
  cancel-in-progress: false

jobs:
  empirical-economic-validation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run independent empirical economic validation
        run: python scripts/economic_validation.py
