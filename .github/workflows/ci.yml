name: SYNPORA CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract application package
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile("SYNPORA_1_0_1_DEPLOY_READY.zip")
          z.extractall("/tmp/pkg")
          root=Path("/tmp/pkg/synpora_deploy/synpora_v71_90_work")
          for name in ("backend","frontend"):
              import shutil
              shutil.copytree(root/name,name)
          PY
      - name: Overlay production backend
        run: |
          cp "$GITHUB_WORKSPACE/saas_api.py" backend/app/saas_api.py
      - name: Syntax check
        run: |
          python -m py_compile backend/app/*.py
          python -m py_compile server.py saas_api.py synpora_enhancement.py
      - name: Import smoke test
        run: |
          pip install -q -r backend/requirements.txt
          SYNPORA_JWT_SECRET=ci-test-secret python - <<'PY'
          from backend.app.main import app
          from backend.app.saas_api import install
          install(app)
          print("SYNPORA import smoke test: OK")
          PY
      - name: API end-to-end smoke test
        run: |
          SYNPORA_JWT_SECRET=ci-test-secret SYNPORA_DISABLE_BUILTIN_MARKET_SOURCES=1 python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.app.main import app
          from backend.app.saas_api import install
          install(app)
          c=TestClient(app)
          email="ci-smoke@example.com"
          reg=c.post("/api/v1/auth/register",json={"email":email,"password":"ci-password-123"})
          assert reg.status_code==200, reg.text
          duplicate=c.post("/api/v1/auth/register",json={"email":email,"password":"ci-password-123"})
          assert duplicate.status_code==409, duplicate.text
          assert c.post("/api/v1/auth/register",json={"email":"invalid-email","password":"ci-password-123"}).status_code==400
          assert c.post("/api/v1/auth/register",json={"email":"ci-long-password@example.com","password":"x"*1025}).status_code==400
          assert c.post("/api/v1/auth/login",json={"email":email,"password":"x"*1025}).status_code==400
          token=reg.json()["token"]
          farm=reg.json()["farm"]["id"]
          assert reg.json()["user"]["email"] == email
          owner_headers={"Authorization":"Bearer "+token}
          asset=c.post(f"/api/v1/farms/{farm}/assets",headers=owner_headers,json={"name":"GPU test","kind":"gpu","power_kw":1.2})
          assert asset.status_code==200, asset.text
          assert asset.json()["kind"]=="GPU", asset.json()
          assert c.post(f"/api/v1/farms/{farm}/assets",headers=owner_headers,json={"name":"bad","kind":"unknown","power_kw":1}).status_code==422
          assert c.post(f"/api/v1/farms/{farm}/assets",headers=owner_headers,json={"name":"bad","kind":"GPU","power_kw":-1}).status_code==422
          other=c.post("/api/v1/auth/register",json={"email":"ci-other-owner@example.com","password":"ci-password-123"})
          assert other.status_code==200, other.text
          other_headers={"Authorization":"Bearer "+other.json()["token"]}
          assert c.get(f"/api/v1/farms/{farm}/assets",headers=other_headers).status_code==404
          assert c.post(f"/api/v1/farms/{farm}/assets",headers=other_headers,json={"name":"intrusion","kind":"GPU","power_kw":1}).status_code==404
          login=c.post("/api/v1/auth/login",json={"email":"  "+email+"  ","password":"ci-password-123"})
          assert login.status_code==200, login.text
          # Repeated failed login attempts for one account key are throttled.
          for _ in range(5):
              denied=c.post("/api/v1/auth/login",json={"email":"rate-limit-ci@example.com","password":"wrong-password"})
              assert denied.status_code==401, denied.text
          limited=c.post("/api/v1/auth/login",json={"email":"rate-limit-ci@example.com","password":"wrong-password"})
          assert limited.status_code==429, limited.text
          assert int(limited.headers.get("Retry-After","0"))>0, limited.headers
          h={"Authorization":"Bearer "+token}
          decision=c.post(f"/api/v1/farms/{farm}/decision-engine",headers=h,json={"energy_kwh":100,"scenarios":100,"seed":42,"risk_aversion":0.75})
          assert decision.status_code==200, decision.text
          body=decision.json()
          assert body["recommended"] in {"AI Compute","BTC Mining","Battery","Grid"}
          assert 0 <= body["risk_aversion"] <= 1
          assert "expected_regret_eur_kwh" in body["decision"]
          assert body["hardware_write"] is False
          assert body["method"] == "unified_forecast_risk_regret_v1"
          assert body["recommendation_only"] is True
          assert "cost_model" in body, body
          risk_payload={"scenarios":50,"seed":42,"risk_aversion":0.5}
          risk=c.post(f"/api/v1/farms/{farm}/risk-analysis",headers=h,json=risk_payload)
          assert risk.status_code==200, risk.text
          rb=risk.json()
          assert rb["samples"] == 50 and rb["seed"] == 42, rb
          assert rb["method"] == "deterministic_seeded_monte_carlo_lognormal_shocks_with_stress_tests", rb
          assert rb["recommendation_only"] is True and rb["hardware_write"] is False, rb
          assert set(rb["strategies"]) == {"AI Compute","BTC Mining","Battery","Grid"}, rb["strategies"]
          for name,metrics in rb["strategies"].items():
              assert all(k in metrics for k in ("mean","p05","p10","p50","p90","expected_shortfall_p05","downside","volatility","probability_positive","probability_negative")), (name,metrics)
              assert metrics["expected_shortfall_p05"] <= metrics["p05"] <= metrics["p10"] <= metrics["p50"] <= metrics["p90"], (name,metrics)
              assert 0 <= metrics["probability_negative"] <= 1, (name,metrics)
          assert len(rb["stress_scenarios"]) == 4, rb
          assert rb["risk_gate"]["status"] in {"loss_exposure","high_uncertainty","within_simulated_limits"}, rb
          risk_repeat=c.post(f"/api/v1/farms/{farm}/risk-analysis",headers=h,json=risk_payload)
          assert risk_repeat.status_code==200, risk_repeat.text
          rr=risk_repeat.json()
          assert rb["base_case"] == rr["base_case"], (rb["base_case"],rr["base_case"])
          assert rb["strategies"] == rr["strategies"], "Fixed seed must produce repeatable risk metrics"
          assert set(rb["regret_vs_base_best_eur"]) == set(rb["strategies"]), rb["regret_vs_base_best_eur"]
          assert all(v >= 0 for v in rb["regret_vs_base_best_eur"].values()), rb["regret_vs_base_best_eur"]
          scenario=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={
              "energy_kwh":100,"energy_cost_eur_kwh":0.05,
              "btc_hashprice_usd_ph_day":39.64,"asic_efficiency_j_th":20})
          assert scenario.status_code==200, scenario.text
          btc_value=next(row["value_eur_kwh"] for row in scenario.json()["ranking"] if row["option"]=="BTC Mining")
          assert 0.01 < btc_value < 0.10, btc_value
          assert "cost_model" in scenario.json(), scenario.json()
          negative_spot=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={"energy_cost_eur_kwh":-0.05})
          assert negative_spot.status_code==200, negative_spot.text
          negative_values={row["option"]:row["value_eur_kwh"] for row in negative_spot.json()["ranking"]}
          assert negative_values["BTC Mining"]>btc_value, (negative_values,btc_value)
          costed=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={
              "energy_kwh":100,"energy_cost_eur_kwh":0.05,
              "btc_hashprice_usd_ph_day":39.64,"asic_efficiency_j_th":20,
              "gpu_capex_eur":15000,"gpu_lifetime_years":5,"gpu_maintenance_eur_year":500,
              "btc_capex_eur":5000,"btc_lifetime_years":4,"btc_maintenance_eur_year":200,
              "gpu_uptime":0.90,"btc_uptime":0.95,"pool_fee":0.03,"tax_rate":0.25})
          assert costed.status_code==200, costed.text
          cm=costed.json()["cost_model"]
          assert cm["gpu"]["depreciation_and_maintenance_eur_kwh"]>0, cm
          assert cm["btc"]["depreciation_and_maintenance_eur_kwh"]>0, cm
          assert cm["tax_rate"]==0.25 and cm["gpu"]["uptime"]==0.90, cm
          costed_values={row["option"]:row["value_eur_kwh"] for row in costed.json()["ranking"]}
          assert costed_values["BTC Mining"]<btc_value, (costed_values,btc_value)
          invalid_lifetime=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={"gpu_lifetime_years":0})
          assert invalid_lifetime.status_code==422, invalid_lifetime.text
          assert "cost_model" in rb, rb
          # Invalid physical and financial inputs must fail clearly instead of being clamped silently.
          invalid_energy=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={"energy_kwh":-1})
          assert invalid_energy.status_code==422, invalid_energy.text
          excessive_samples=c.post(f"/api/v1/farms/{farm}/optimize",headers=h,json={"samples":1000000000})
          assert excessive_samples.status_code==422, excessive_samples.text
          invalid_seed=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={"seed":999999999999})
          assert invalid_seed.status_code==422, invalid_seed.text
          excessive_scenarios=c.post(f"/api/v1/farms/{farm}/risk-analysis",headers=h,json={"scenarios":1000000000})
          assert excessive_scenarios.status_code==422, excessive_scenarios.text
          extreme_energy=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={"energy_kwh":1e308})
          assert extreme_energy.status_code==422, extreme_energy.text
          invalid_shock=c.post(f"/api/v1/farms/{farm}/risk-analysis",headers=h,json={"shock_pct":1.0})
          assert invalid_shock.status_code==422, invalid_shock.text
          invalid_soc=c.post(f"/api/v1/farms/{farm}/dispatch-plan",headers=h,json={"battery_soc_pct":101})
          assert invalid_soc.status_code==422, invalid_soc.text
          # Loss-making compute/mining must stay negative rather than being hidden as break-even.
          loss=c.post(f"/api/v1/farms/{farm}/scenario",headers=h,json={
              "energy_kwh":100,"energy_cost_eur_kwh":10.0,
              "btc_hashprice_usd_ph_day":39.64,"asic_efficiency_j_th":20})
          assert loss.status_code==200, loss.text
          loss_values={row["option"]:row["value_eur_kwh"] for row in loss.json()["ranking"]}
          assert loss_values["BTC Mining"] < 0, loss_values
          assert loss_values["AI Compute"] < 0, loss_values
          # Dispatch energy accounting: PV must be allocated exactly once and battery reserve preserved.
          for kind,power in (("GPU",0.5),("BTC",0.5)):
              asset=c.post(f"/api/v1/farms/{farm}/assets",headers=h,json={"name":kind+" test asset","kind":kind,"power_kw":power})
              assert asset.status_code==200, asset.text
          saved_assets=c.get(f"/api/v1/farms/{farm}/assets",headers=h)
          assert saved_assets.status_code==200 and len(saved_assets.json())==3, saved_assets.text
          charging=c.post(f"/api/v1/farms/{farm}/dispatch-plan",headers=h,json={
              "horizon_hours":24,"pv_kwh":20,"battery_capacity_kwh":100,
              "battery_soc_pct":20,"battery_reserve_pct":20,"battery_power_kw":10,
              "battery_charge_efficiency":0.95,"battery_discharge_efficiency":0.95})
          assert charging.status_code==200, charging.text
          cs=charging.json()["summary"]
          assert abs(cs["pv_balance_error_kwh"]) < 0.01, cs
          assert cs["battery_charge_kwh"] > 0, cs
          assert abs(cs["battery_charge_stored_kwh"]-cs["battery_charge_kwh"]*0.95) < 0.01, cs
          assert abs(cs["battery_soc_balance_error_kwh"]) < 0.01, cs
          assert cs["battery_losses_kwh"] >= cs["battery_charge_kwh"]*0.05-0.01, cs
          assert cs["battery_soc_final_kwh"] >= cs["battery_soc_reserve_kwh"]-0.01, cs
          discharging=c.post(f"/api/v1/farms/{farm}/dispatch-plan",headers=h,json={
              "horizon_hours":24,"pv_kwh":0,"battery_capacity_kwh":10,
              "battery_soc_pct":100,"battery_reserve_pct":20,"battery_power_kw":2,
              "energy_cost_eur_kwh":0.2,"battery_discharge_efficiency":0.9})
          assert discharging.status_code==200, discharging.text
          ds=discharging.json()["summary"]
          assert ds["battery_discharge_kwh"] > 0, ds
          assert ds["battery_losses_kwh"] > 0, ds
          assert abs(ds["battery_soc_balance_error_kwh"]) < 0.01, ds
          assert ds["battery_soc_final_kwh"] >= ds["battery_soc_reserve_kwh"]-0.01, ds
          assert all(row["soc_pct"] >= 19.99 for row in discharging.json()["soc_trace"]), ds
          exporting=c.post(f"/api/v1/farms/{farm}/dispatch-plan",headers=h,json={
              "horizon_hours":24,"pv_kwh":50,"battery_capacity_kwh":10,
              "battery_soc_pct":100,"battery_reserve_pct":20,"battery_power_kw":5})
          assert exporting.status_code==200, exporting.text
          es=exporting.json()["summary"]
          assert abs(es["pv_balance_error_kwh"]) < 0.01, es
          assert es["grid_export_kwh"] > 0, es
          assert abs(es["battery_soc_balance_error_kwh"]) < 0.01, es
          assert es["battery_soc_final_kwh"] >= es["battery_soc_reserve_kwh"]-0.01, es
          quality=c.get(f"/api/v1/farms/{farm}/decision-quality",headers=h)
          assert quality.status_code==200, quality.text
          # Learning ledger must work on a fresh schema and must not settle without later valid observations.
          recorded=c.post(f"/api/v1/farms/{farm}/decision",headers=h,json={"energy_kwh":100,"energy_cost_eur_kwh":0.05})
          assert recorded.status_code==200, recorded.text
          learning=c.post(f"/api/v1/farms/{farm}/learning/update",headers=h)
          assert learning.status_code==200, learning.text
          lb=learning.json()
          assert lb["settled_now"]==0 and lb["open_remaining"]>=1, lb
          assert lb["hardware_write"] is False and lb["recommendation_only"] is True, lb
          learning_status=c.get(f"/api/v1/farms/{farm}/learning",headers=h)
          assert learning_status.status_code==200, learning_status.text
          assert learning_status.json()["open"]>=1, learning_status.json()
          # A later valid market snapshot must settle the pending decision exactly once.
          import os
          import backend.app.saas_api as saas
          os.environ["SYNPORA_MARKET_ADMIN_TOKEN"]="ci-market-secret"
          snap=c.post("/api/v1/market/snapshot",headers={"X-SYNPORA-MARKET-TOKEN":"ci-market-secret"})
          assert snap.status_code==200, snap.text
          assert snap.json()["source"]=="manual_reference_snapshot", snap.json()
          assert snap.json()["data_quality"]["overall"]=="reference", snap.json()
          reference_forecast=c.post(f"/api/v1/farms/{farm}/forecast-plan",headers=h,json={"horizon_hours":3})
          assert reference_forecast.status_code==200, reference_forecast.text
          assert all(v["samples"]==0 for v in reference_forecast.json()["models"].values()), reference_forecast.json()["models"]
          # A reference-only snapshot must never become a learning label.
          settled=c.post(f"/api/v1/farms/{farm}/learning/update",headers=h)
          assert settled.status_code==200, settled.text
          sb=settled.json()
          assert sb["settled_now"]==0 and sb["open_remaining"]>=1, sb
          assert sb["skipped_ineligible_snapshots"]>=1, sb
          assert "manual_reference_snapshot" not in sb["snapshot_sources_used"], sb
          # A fully externally sourced observation can settle the open decision exactly once.
          import time, json, uuid
          db=saas.init_db()
          ts=time.time()
          provenance={"fields":{
              "btc_hashprice_usd_ph_day":{"source":"external","available":True},
              "gpu_l40s_usd_hour":{"source":"external","available":True},
              "eur_usd":{"source":"external","available":True},
              "austria_spot_eur_kwh":{"source":"external","available":True}}}
          payload={"timestamp":ts,"source":"validated_external_observation",
              "btc_hashprice_usd_ph_day":40.0,"gpu_l40s_usd_hour":1.2,
              "eur_usd":1.1,"austria_spot_eur_kwh":0.08,
              "gpu_l40s_power_kw":0.35,"gpu_utilization":0.7,"gpu_platform_fee":0.15,
              "data_quality":provenance}
          db.execute("INSERT INTO market_snapshots (id,ts,payload,btc_hashprice_usd_ph_day,gpu_l40s_usd_hour,eur_usd,austria_spot_eur_kwh) VALUES (?,?,?,?,?,?,?)",
              (str(uuid.uuid4()),ts,json.dumps(payload),40.0,1.2,1.1,0.08))
          db.commit()
          external_forecast=c.post(f"/api/v1/farms/{farm}/forecast-plan",headers=h,json={"horizon_hours":3})
          assert external_forecast.status_code==200, external_forecast.text
          assert all(v["samples"]==1 for v in external_forecast.json()["models"].values()), external_forecast.json()["models"]
          settled=c.post(f"/api/v1/farms/{farm}/learning/update",headers=h)
          assert settled.status_code==200, settled.text
          sb=settled.json()
          assert sb["settled_now"]==1 and sb["open_remaining"]==0, sb
          assert "validated_external_observation" in sb["snapshot_sources_used"], sb
          assert sb["hardware_write"] is False and sb["recommendation_only"] is True, sb
          # Leave a reference snapshot as the newest observation for the forecast warning test.
          snap_again=c.post("/api/v1/market/snapshot",headers={"X-SYNPORA-MARKET-TOKEN":"ci-market-secret"})
          assert snap_again.status_code==200, snap_again.text
          # Market API must disclose provenance instead of presenting reference prices as live.
          market=c.get("/api/v1/market/live")
          assert market.status_code==200, market.text
          mq=market.json()["data_quality"]
          assert mq["overall"] in {"live","partial","fallback"}, mq
          assert "details" in mq and "fields" in mq["details"], mq
          assert mq["details"]["fields"]["eur_usd"]["source"]=="reference", mq
          assert mq["details"]["fields"]["austria_spot_eur_kwh"]["source"]=="reference", mq
          assert mq["details"]["fields"]["gpu_l40s_usd_hour"]["source"]=="reference", mq
          # Built-in provider adapters validate provider timestamps, energy units and GPU offers.
          import urllib.request, datetime
          old_urlopen_builtin=urllib.request.urlopen
          old_disabled=os.environ.pop("SYNPORA_DISABLE_BUILTIN_MARKET_SOURCES",None)
          old_vast_key=os.environ.get("SYNPORA_VAST_API_KEY")
          os.environ["SYNPORA_VAST_API_KEY"]="ci-vast-test-key"
          class BuiltinResponse:
              def __init__(self,payload): self.payload=payload
              def __enter__(self): return self
              def __exit__(self,*args): return False
              def read(self,size=-1): return json.dumps(self.payload).encode()
          def builtin_urlopen(request,timeout=5):
              url=request.full_url if hasattr(request,"full_url") else str(request)
              now=time.time()
              if "pro.startmining.io" in url:
                  return BuiltinResponse({"hashpriceUsd":41.0,"btcPrice":82000.0,"difficulty":100.0,"networkHashrate":900.0})
              if "frankfurter.dev" in url:
                  return BuiltinResponse({"date":datetime.datetime.now(datetime.timezone.utc).date().isoformat(),"base":"EUR","quote":"USD","rate":1.12})
              if "energy-charts.info" in url:
                  return BuiltinResponse({"series":[{"id":"price","name":"Price","unit":"EUR/MWh"}],
                      "data":[{"timestamp":datetime.datetime.fromtimestamp(now-300,datetime.timezone.utc).isoformat(),"values":{"price":75.0}}],
                      "attributes":{"valid_until":datetime.datetime.fromtimestamp(now+1800,datetime.timezone.utc).isoformat()}})
              if "cloud.vast.ai" in url:
                  return BuiltinResponse({"offers":[{"gpu_name":"NVIDIA L40S","dph_total":1.20,"num_gpus":1},
                      {"gpu_name":"NVIDIA L40S","dph_total":1.40,"num_gpus":1}]})
              raise OSError("Unexpected network request in provider adapter test")
          urllib.request.urlopen=builtin_urlopen
          try:
              builtins=c.get("/api/v1/market/live")
              assert builtins.status_code==200, builtins.text
              bm=builtins.json()
              assert bm["data_quality"]["overall"]=="live", bm["data_quality"]
              assert bm["data_quality"]["details"]["fields"]["eur_usd"]["source"]=="external", bm["data_quality"]
              assert bm["data_quality"]["details"]["fields"]["eur_usd"]["provider"].startswith("Frankfurter"), bm["data_quality"]
              energy_field=bm["data_quality"]["details"]["fields"]["austria_spot_eur_kwh"]
              assert energy_field["source"]=="external", bm["data_quality"]
              assert energy_field["source_url"].startswith("https://api.energy-charts.info/"), energy_field
              assert "CC BY 4.0" in energy_field["license"], energy_field
              assert abs(bm["austria_spot_eur_kwh"]-0.075)<0.00001, bm["austria_spot_eur_kwh"]
              assert bm["data_quality"]["details"]["fields"]["gpu_l40s_usd_hour"]["source"]=="external", bm["data_quality"]
              assert abs(bm["gpu"]["hourly_usd"]-1.30)<0.00001, bm["gpu"]
          finally:
              urllib.request.urlopen=old_urlopen_builtin
              if old_disabled is not None: os.environ["SYNPORA_DISABLE_BUILTIN_MARKET_SOURCES"]=old_disabled
              if old_vast_key is None: os.environ.pop("SYNPORA_VAST_API_KEY",None)
              else: os.environ["SYNPORA_VAST_API_KEY"]=old_vast_key
          # Configured feed must be HTTPS, timestamp-fresh and field-validated before provenance is external.
          import urllib.request, socket
          original_urlopen=urllib.request.urlopen
          original_build_opener=urllib.request.build_opener
          original_getaddrinfo=socket.getaddrinfo
          class FakeFeedResponse:
              def __init__(self,payload): self.payload=payload
              def __enter__(self): return self
              def __exit__(self,*args): return False
              def read(self,size=-1): return json.dumps(self.payload).encode()
          feed_headers_seen={}
          class FakeFeedOpener:
              def open(self,request,timeout=5):
                  url=request.full_url
                  feed_headers_seen.update(dict(request.header_items()))
                  if "feed.example.test" in url:
                      return FakeFeedResponse({"timestamp":time.time(),"source":"ci-test-feed",
                          "btc_hashprice_usd_ph_day":41.0,"gpu_l40s_usd_hour":1.30,
                          "eur_usd":1.09,"austria_spot_eur_kwh":0.075,
                          "gpu_l40s_power_kw":0.35,"gpu_utilization":0.70,"gpu_platform_fee":0.15})
                  raise OSError("Unexpected feed host in CI")
          def fake_build_opener(*handlers):
              assert any(isinstance(handler,type) and issubclass(handler,urllib.request.HTTPRedirectHandler)
                         and handler().redirect_request(None,None,302,"Found",{},"https://127.0.0.1/") is None
                         for handler in handlers), "Redirects must be disabled for custom market feeds"
              return FakeFeedOpener()
          def fake_urlopen(request,timeout=5):
              raise OSError("External network intentionally disabled in CI")
          old_feed_url=os.environ.get("SYNPORA_MARKET_DATA_URL")
          old_feed_hosts=os.environ.get("SYNPORA_MARKET_DATA_ALLOWED_HOSTS")
          old_feed_key=os.environ.get("SYNPORA_MARKET_DATA_API_KEY")
          os.environ["SYNPORA_MARKET_DATA_URL"]="https://feed.example.test/market"
          os.environ["SYNPORA_MARKET_DATA_ALLOWED_HOSTS"]="feed.example.test"
          os.environ["SYNPORA_MARKET_DATA_API_KEY"]="ci-feed-secret"
          urllib.request.urlopen=fake_urlopen
          urllib.request.build_opener=fake_build_opener
          socket.getaddrinfo=lambda host,port,type: [(socket.AF_INET,socket.SOCK_STREAM,6,"",("93.184.216.34",port))]
          try:
              feed_market=c.get("/api/v1/market/live")
              assert feed_market.status_code==200, feed_market.text
              fm=feed_market.json()
              assert fm["data_quality"]["overall"]=="live", fm["data_quality"]
              assert fm["data_quality"]["details"]["configured_feed_accepted"] is True, fm["data_quality"]
              readiness_feed=c.get("/api/v1/system/production-readiness").json()
              assert readiness_feed["market_data_feed_host_allowlisted"] is True, readiness_feed
              assert feed_headers_seen.get("Authorization")=="Bearer ci-feed-secret", feed_headers_seen
              for field in ("btc_hashprice_usd_ph_day","gpu_l40s_usd_hour","eur_usd","austria_spot_eur_kwh"):
                  assert fm["data_quality"]["details"]["fields"][field]["source"]=="external", fm["data_quality"]
              socket.getaddrinfo=lambda host,port,type: [(socket.AF_INET,socket.SOCK_STREAM,6,"",("127.0.0.1",port))]
              private_dns=c.get("/api/v1/market/live")
              assert private_dns.status_code==200 and private_dns.json()["data_quality"]["details"]["configured_feed_accepted"] is False, private_dns.json()
              socket.getaddrinfo=lambda host,port,type: [(socket.AF_INET,socket.SOCK_STREAM,6,"",("93.184.216.34",port))]
              os.environ["SYNPORA_MARKET_DATA_URL"]="https://evil.example/market"
              rejected=c.get("/api/v1/market/live")
              assert rejected.status_code==200, rejected.text
              assert rejected.json()["data_quality"]["details"]["configured_feed_accepted"] is False, rejected.json()
              assert c.get("/api/v1/system/production-readiness").json()["market_data_feed_host_allowlisted"] is False
          finally:
              urllib.request.urlopen=original_urlopen
              urllib.request.build_opener=original_build_opener
              socket.getaddrinfo=original_getaddrinfo
              for name,old in (("SYNPORA_MARKET_DATA_URL",old_feed_url),
                               ("SYNPORA_MARKET_DATA_ALLOWED_HOSTS",old_feed_hosts),
                               ("SYNPORA_MARKET_DATA_API_KEY",old_feed_key)):
                  if old is None: os.environ.pop(name,None)
                  else: os.environ[name]=old
          # Forecasts expose readiness and validation warnings when historical data is sparse.
          forecast=c.post(f"/api/v1/farms/{farm}/forecast-plan",headers=h,json={"horizon_hours":3})
          assert forecast.status_code==200, forecast.text
          fq=forecast.json()["forecast_quality"]
          assert fq["status"] in {"validated","degraded","invalid"}, fq
          assert fq["horizon_hours"]==3 and "model_readiness" in fq, fq
          assert "market_snapshot_freshness" in fq, fq
          assert fq["market_snapshot_freshness"]["source"] == "manual_reference_snapshot", fq
          assert any("reference values" in warning for warning in fq["warnings"]), fq
          assert forecast.json()["hardware_write"] is False
          # Walk-forward backtesting must use consecutive fully external snapshots, never reference snapshots.
          for offset,hashprice,gpu,fx,energy in ((-7200,38.0,1.00,1.10,0.07),(-3600,42.0,1.25,1.12,0.09)):
              historical={"timestamp":ts+offset,"source":"validated_external_observation",
                  "btc_hashprice_usd_ph_day":hashprice,"gpu_l40s_usd_hour":gpu,
                  "eur_usd":fx,"austria_spot_eur_kwh":energy,
                  "gpu_l40s_power_kw":0.35,"gpu_utilization":0.7,"gpu_platform_fee":0.15,
                  "data_quality":provenance}
              db.execute("INSERT INTO market_snapshots (id,ts,payload,btc_hashprice_usd_ph_day,gpu_l40s_usd_hour,eur_usd,austria_spot_eur_kwh,gpu_l40s_power_kw,gpu_utilization,gpu_platform_fee) VALUES (?,?,?,?,?,?,?,?,?,?)",
                  (str(uuid.uuid4()),ts+offset,json.dumps(historical),hashprice,gpu,fx,energy,0.35,0.7,0.15))
          db.commit()
          backtest=c.post(f"/api/v1/farms/{farm}/backtest",headers=h,json={"min_samples":1,"max_snapshots":100})
          assert backtest.status_code==200, backtest.text
          bt=backtest.json()
          assert bt["method"]=="strict_walk_forward_next_snapshot_v1", bt
          assert bt["status"]=="evaluated" and bt["evaluated_pairs"]>=2, bt
          assert bt["metrics"]["mean_regret_eur_kwh"] is not None, bt
          assert bt["recommendation_only"] is True and bt["hardware_write"] is False, bt
          benchmark=c.get(f"/api/v1/farms/{farm}/benchmark",headers=h)
          assert benchmark.status_code==200, benchmark.text
          bm=benchmark.json()
          assert bm["method"]=="provenance_gated_snapshot_benchmark", bm
          assert bm["samples"]>=3 and bm["excluded_snapshots"]>=2, bm
          assert "Grid" in bm["mean_net_eur_per_100_kwh"], bm
          data_health=c.get("/api/v1/market/data-health")
          assert data_health.status_code==200, data_health.text
          dh=data_health.json()
          assert dh["eligible_snapshots"]>=3 and dh["excluded_or_invalid_snapshots"]>=2, dh
          assert dh["latest_snapshot_timestamp"] is not None, dh
          assert dh["latest_snapshot_age_seconds"]>=0, dh
          assert dh["collection_status"] in {"recent_snapshot","stale_snapshot","never_collected"}, dh
          assert isinstance(dh["latest_snapshot_fields"],dict), dh
          assert dh["recommendation_only"] is True and dh["hardware_write"] is False, dh
          # Market history clamps negative/oversized limits and remains available
          # when one historical JSON payload is malformed.
          history_default=c.get("/api/v1/market/history")
          assert history_default.status_code==200 and len(history_default.json())<=100, history_default.text
          history_negative=c.get("/api/v1/market/history?limit=-1")
          assert history_negative.status_code==200 and 1<=len(history_negative.json())<=500, history_negative.text
          history_large=c.get("/api/v1/market/history?limit=999999")
          assert history_large.status_code==200 and len(history_large.json())<=500, history_large.text
          from backend.app import saas_api as saas
          import time
          db=saas.init_db()
          malformed_id="ci-malformed-history"
          db.execute("DELETE FROM market_snapshots WHERE id=?",(malformed_id,))
          db.execute("INSERT INTO market_snapshots(id,ts,payload) VALUES(?,?,?)",(malformed_id,time.time()+1,"{invalid-json"))
          db.commit()
          malformed_history=c.get("/api/v1/market/history?limit=1")
          assert malformed_history.status_code==200, malformed_history.text
          assert malformed_history.json()[0]["payload_valid"] is False, malformed_history.text
          db.execute("DELETE FROM market_snapshots WHERE id=?",(malformed_id,))
          db.commit()
          db.close()
          paper=c.get(f"/api/v1/farms/{farm}/paper-trading",headers=h)
          assert paper.status_code==200, paper.text
          pb=paper.json()
          assert pb["mode"]=="paper_trading_only" and pb["hardware_write"] is False, pb
          assert pb["settled_decisions"]>=1 and "strategy_metrics" in pb, pb
          bad=c.post("/api/v1/auth/register",json={"email":"not-an-email","password":"ci-password-123"})
          assert bad.status_code==400, bad.text
          readiness=c.get("/api/v1/system/production-readiness")
          assert readiness.status_code==200, readiness.text
          assert readiness.json()["hardware_write_enabled"] is False
          assert readiness.json()["database_schema_ready"] is True
          for path in ("/api/v1/market/collect", "/api/v1/market/backfill", "/api/v1/market/snapshot"):
              protected=c.post(path)
              assert protected.status_code==403, (path, protected.status_code, protected.text)
          # Production must never silently fall back to ephemeral SQLite.
          import backend.app.saas_api as saas
          old_db_url=saas.DB_URL
          old_required=os.environ.get("SYNPORA_REQUIRE_DATABASE")
          saas.DB_URL=""
          os.environ["SYNPORA_REQUIRE_DATABASE"]="1"
          try:
              saas._conn()
              raise AssertionError("Production without DATABASE_URL must fail closed")
          except RuntimeError as exc:
              assert "DATABASE_URL is required" in str(exc), str(exc)
              readiness_required=c.get("/api/v1/system/production-readiness")
              assert readiness_required.status_code==200, readiness_required.text
              assert readiness_required.json()["database_backend"]=="unavailable", readiness_required.json()
              assert readiness_required.json()["database_schema_ready"] is False, readiness_required.json()
              assert readiness_required.json()["jwt_secret_strong"] is False, readiness_required.json()
              assert "market_admin_token_strong" in readiness_required.json(), readiness_required.json()
          finally:
              saas.DB_URL=old_db_url
              if old_required is None: os.environ.pop("SYNPORA_REQUIRE_DATABASE",None)
              else: os.environ["SYNPORA_REQUIRE_DATABASE"]=old_required
          # File-backed SQLite data must survive fresh connections, unlike the ephemeral default /tmp database.
          import tempfile
          from pathlib import Path
          old_db_path=saas.DB_PATH
          old_db_url_persistence=saas.DB_URL
          with tempfile.TemporaryDirectory() as td:
              saas.DB_URL=""
              saas.DB_PATH=str(Path(td)/"persistent.db")
              first=saas.init_db()
              first.execute("INSERT INTO synpora_saas_users VALUES(?,?,?,?)",("persist-user","persist-ci@example.com","test-hash",time.time()))
              first.execute("INSERT INTO synpora_saas_farms VALUES(?,?,?,?)",("persist-farm","persist-user","Persistence CI",time.time()))
              first.commit()
              first.close()
              reopened=saas.init_db()
              persisted_user=reopened.execute("SELECT email FROM synpora_saas_users WHERE id=?",("persist-user",)).fetchone()
              persisted_farm=reopened.execute("SELECT name FROM synpora_saas_farms WHERE id=?",("persist-farm",)).fetchone()
              assert persisted_user and persisted_user["email"]=="persist-ci@example.com", persisted_user
              assert persisted_farm and persisted_farm["name"]=="Persistence CI", persisted_farm
              reopened.close()
          saas.DB_PATH=old_db_path
          saas.DB_URL=old_db_url_persistence
          print("SYNPORA file-backed persistence smoke test: OK")
          print("SYNPORA API end-to-end smoke test: OK")
          PY

      - name: JWT claim validation regression test
        run: |
          SYNPORA_JWT_SECRET=ci-test-secret python - <<'PY'
          import base64, hashlib, hmac, json, time
          from backend.app import saas_api as saas

          def signed(claims):
              body=json.dumps(claims,separators=(",",":"),allow_nan=True).encode()
              encoded=base64.urlsafe_b64encode(body).decode().rstrip("=")
              signature=hmac.new(saas.JWT_SECRET.encode(),encoded.encode(),hashlib.sha256).hexdigest()
              return encoded+"."+signature

          assert saas._uid(signed({"uid":"user-123","exp":time.time()+60}))=="user-123"
          assert saas._uid(signed({"uid":["user-123"],"exp":time.time()+60})) is None
          assert saas._uid(signed({"uid":"","exp":time.time()+60})) is None
          assert saas._uid(signed({"uid":"user-123","exp":True})) is None
          assert saas._uid(signed({"uid":"user-123","exp":float("nan")})) is None
          assert saas._uid(signed({"uid":"user-123","exp":time.time()-60})) is None
          assert saas._uid("not-a-token") is None
          print("SYNPORA JWT claim validation regression test: OK")
          PY

      - name: Operations dashboard smoke test
        run: |
