name: SYNPORA Market Collection

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Collect a market snapshot
        env:
          SYNPORA_BASE_URL: ${{ secrets.SYNPORA_BASE_URL }}
          SYNPORA_MARKET_ADMIN_TOKEN: ${{ secrets.SYNPORA_MARKET_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNPORA_BASE_URL}" ] || [ -z "${SYNPORA_MARKET_ADMIN_TOKEN}" ]; then
            echo "::notice::Market collection skipped. Configure repository Actions secrets SYNPORA_BASE_URL and SYNPORA_MARKET_ADMIN_TOKEN."
            exit 0
          fi
          BASE_URL="${SYNPORA_BASE_URL%/}"
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "${BASE_URL}/api/v1/market/collect" \
            -H "X-SYNPORA-MARKET-TOKEN: ${SYNPORA_MARKET_ADMIN_TOKEN}" \
            -H "Accept: application/json")"
          printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); q=d.get("data_quality",{}); print("Market snapshot stored; source="+str(d.get("source"))+"; quality="+str(q.get("status"))+"; external_fields="+str(q.get("external_fields"))+"; reference_fields="+str(q.get("reference_fields"))); print("Warnings: "+" | ".join(q.get("warnings", [])))'
